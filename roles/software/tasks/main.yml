---
# brickburg/linuxrouter/roles/software/tasks/main.yml

- name: Install packages
  apt:
    force_apt_get: yes
    name:
      - tcpdump
      - rfkill
      - net-tools
      - dnsutils
      - whois
      - vim
      - iperf3
      - iperf
      - jq
      - htop
      - lm-sensors
      - smartmontools
      - screen
      - curl
      - bc
      - iputils-ping

- name: Uninstall packages
  apt:
    force_apt_get: yes
    state: absent
    name:
      - os-prober

- name: vimrc
  copy:
    src: files/vimrc
    dest: /root/.vimrc
    owner: root
    group: root
    mode: u=rw,go=r

- name: htop config folder
  file:
    path: /root/.config/htop
    owner: root
    group: root
    mode: u=rwx,go=rx
    state: directory

- name: htop configuration
  copy:
    src: files/htoprc
    dest: /root/.config/htop/htoprc
    owner: root
    group: root
    mode: u=rw,go=r

- name: Install minimon.sh
  ansible.builtin.get_url:
    url: https://github.com/perryflynn/minimon/raw/master/minimon.sh
    dest: /usr/local/bin/minimon.sh
    mode: u=rwx,go=rx
    owner: root
    group: root
